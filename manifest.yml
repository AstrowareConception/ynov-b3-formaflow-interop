repository:
  name: ynov-b3-formaflow-interop
  version: 1.0.0
  status: teaching
  stage: reference-final
  academic_year: 2026-2027
  module: Echange de donnees et interoperabilite
  duration_hours: 14
  ffp_hours: 6
  tdp_hours: 8

reference:
  source_repository: ynov-b3-formaflow-hexagonal
  source_tag: reference-final
  local_path: inputs/architecture-reference
  mode: copied_snapshot

runtime:
  language: Python
  version: "3.12"
  api_framework: FastAPI
  test_framework: pytest
  schema_tools:
    - jsonschema
    - protobuf
    - fastavro
  messaging_client: pika
  broker: RabbitMQ
  comparison_only: Redis Pub/Sub
  external_services_required: false
  data_policy: synthetic_only

teaching:
  total_minutes: 840
  ffp_minutes: 360
  tdp_minutes: 480
  sessions:
    - { id: 1, duration_minutes: 240, ffp_minutes: 120, tdp_minutes: 120 }
    - { id: 2, duration_minutes: 180, ffp_minutes: 90, tdp_minutes: 90 }
    - { id: 3, duration_minutes: 240, ffp_minutes: 90, tdp_minutes: 150 }
    - { id: 4, duration_minutes: 180, ffp_minutes: 60, tdp_minutes: 120 }

commands:
  - setup
  - start
  - stop
  - reset-data
  - contracts
  - benchmark
  - test
  - smoke
  - quality

tags:
  formative:
    - course-start
    - checkpoint-contract
    - checkpoint-serialization
    - checkpoint-async
    - checkpoint-versioning
  canonical:
    - reference-final

assessment: false
formative_individual_check:
  format: qcm
  duration_minutes: 30
  graded: false
  public_content: false

handoff:
  target_repository: ynov-b3-formaflow-agility
  local_path: handoff/agility-reference
  consumer_path: inputs/interop-reference
