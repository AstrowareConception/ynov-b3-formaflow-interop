[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astrobridge"
version = "1.0.0"
description = "FormaFlow interoperability teaching module"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "fastavro==1.12.0",
  "grpcio-tools==1.74.0",
  "httpx==0.28.1",
  "jsonschema==4.25.1",
  "pika==1.3.2",
  "protobuf==6.33.6",
  "PyYAML==6.0.2",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pip-audit==2.9.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.12.12",
  "types-protobuf==6.32.1.20260221",
  "types-PyYAML==6.0.12.20250822",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires the local Compose project",
  "smoke: end-to-end local demonstration",
  "packaging: deterministic distribution checks",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["src/generated", "inputs/architecture-reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["astrobridge"]
exclude = ["src/generated", "inputs/architecture-reference"]
mypy_path = "src"
